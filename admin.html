<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>防災マップ 管理</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      color: #333;
    }

    /* ── ログイン画面 ── */
    #loginScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    #loginScreen .icon { font-size: 56px; margin-bottom: 16px; }
    #loginScreen h2 { font-size: 20px; margin-bottom: 8px; }
    #loginScreen p { color: #666; font-size: 13px; margin-bottom: 36px; text-align: center; }
    #loginBtn {
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 15px 36px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(26,115,232,0.4);
    }

    /* ── ヘッダー ── */
    header {
      background: #1a237e;
      color: #fff;
      padding: env(safe-area-inset-top, 0) 0 0;
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
    }
    header h1 { font-size: 15px; font-weight: bold; }
    #logoutBtn {
      background: rgba(255,255,255,0.18);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 7px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
    }

    /* ── 管理画面 ── */
    #adminScreen { display: none; }
    .container {
      padding: 16px;
      max-width: 540px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.09);
    }
    .card-title {
      font-size: 15px;
      font-weight: bold;
      color: #1a237e;
      border-bottom: 2px solid #e8eaf6;
      padding-bottom: 10px;
      margin-bottom: 16px;
    }

    /* 件数表示 */
    .stat { font-size: 36px; font-weight: bold; color: #1a237e; }
    .stat-label { font-size: 12px; color: #888; margin: 2px 0 18px; }

    /* ボタン共通 */
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 0.03em;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-danger { background: #c62828; color: #fff; }

    /* 受信者リスト */
    .recipient-list { margin-bottom: 14px; min-height: 20px; }
    .recipient-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 0;
      border-bottom: 1px solid #f3f3f3;
      font-size: 14px;
      gap: 8px;
    }
    .recipient-row:last-child { border-bottom: none; }
    .recipient-email { word-break: break-all; flex: 1; }
    .del-btn {
      background: none;
      border: 1px solid #e57373;
      color: #c62828;
      border-radius: 7px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .empty-msg {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      padding: 14px 0;
    }

    /* 追加フォーム */
    .add-row { display: flex; gap: 8px; }
    .add-row input {
      flex: 1;
      padding: 11px 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 14px;
      outline: none;
    }
    .add-row input:focus { border-color: #1a237e; }
    .btn-add {
      background: #1a237e;
      color: #fff;
      border: none;
      border-radius: 9px;
      padding: 11px 16px;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
      white-space: nowrap;
    }

    /* トースト */
    .toast {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 32px);
      left: 50%;
      transform: translateX(-50%);
      background: #323232;
      color: #fff;
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 14px;
      z-index: 9999;
      white-space: nowrap;
      display: none;
      pointer-events: none;
    }
  </style>
</head>
<body>

<!-- ログイン画面 -->
<div id="loginScreen">
  <div class="icon">🗾</div>
  <h2>上戸防災マップ</h2>
  <p>管理者専用ページです。<br>アクセスには管理者アカウントが必要です。</p>
  <button id="loginBtn">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <circle cx="9" cy="9" r="8" stroke="white" stroke-width="1.5"/>
      <path d="M9 5a4 4 0 1 0 0 8A4 4 0 0 0 9 5z" fill="white" opacity="0.5"/>
    </svg>
    Google でログイン
  </button>
</div>

<!-- ヘッダー（管理画面用） -->
<header id="adminHeader" style="display:none">
  <div class="header-inner">
    <h1>🗾 防災マップ 管理</h1>
    <button id="logoutBtn">ログアウト</button>
  </div>
</header>

<!-- 管理画面 -->
<div id="adminScreen">
  <div class="container">

    <!-- 投稿管理 -->
    <div class="card">
      <div class="card-title">📝 投稿管理</div>
      <div class="stat" id="postCount">—</div>
      <div class="stat-label">件の投稿</div>
      <button class="btn btn-danger" id="deleteAllBtn">全件削除</button>
    </div>

    <!-- メール受信者 -->
    <div class="card">
      <div class="card-title">📧 メール受信者</div>
      <div class="recipient-list" id="recipientList">
        <div class="empty-msg">読み込み中...</div>
      </div>
      <div class="add-row">
        <input type="email" id="newEmailInput" placeholder="追加するメールアドレス" autocomplete="email" inputmode="email">
        <button class="btn-add" id="addEmailBtn">追加</button>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
const ALLOWED_EMAIL = 'geoforest.001@gmail.com';

firebase.initializeApp({
  apiKey: 'AIzaSyCVJNDMILPbA4n0hSimX5d-WzcJO_n0oRQ',
  authDomain: 'agatto-map.firebaseapp.com',
  projectId: 'agatto-map',
  storageBucket: 'agatto-map.firebasestorage.app',
  messagingSenderId: '694313355581',
  appId: '1:694313355581:web:e351429ad4e68819b61d54'
});
const db   = firebase.firestore();
const auth = firebase.auth();

/* ── トースト ── */
function showToast(msg, ms) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.style.display = 'none'; }, ms || 2500);
}

/* ── 認証状態 ── */
auth.onAuthStateChanged(function(user) {
  if (user && user.email.toLowerCase() === ALLOWED_EMAIL.toLowerCase()) {
    document.getElementById('loginScreen').style.display  = 'none';
    document.getElementById('adminHeader').style.display  = 'block';
    document.getElementById('adminScreen').style.display  = 'block';
    loadPostCount();
    loadRecipients();
  } else {
    if (user) { auth.signOut(); alert('アクセス権がありません。\nログインしたアカウント: ' + user.email); }
    document.getElementById('loginScreen').style.display  = '';
    document.getElementById('adminHeader').style.display  = 'none';
    document.getElementById('adminScreen').style.display  = 'none';
  }
});

document.getElementById('loginBtn').addEventListener('click', function() {
  var provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider)
    .catch(function(e) { showToast('ログイン失敗: ' + e.message, 3000); });
});

document.getElementById('logoutBtn').addEventListener('click', function() {
  auth.signOut();
});

/* ── 投稿件数 ── */
async function loadPostCount() {
  document.getElementById('postCount').textContent = '…';
  try {
    var snap = await db.collection('bbs_posts').get();
    document.getElementById('postCount').textContent = snap.size;
  } catch(e) {
    document.getElementById('postCount').textContent = '?';
  }
}

/* ── 全件削除 ── */
document.getElementById('deleteAllBtn').addEventListener('click', async function() {
  var countText = document.getElementById('postCount').textContent;
  var count = parseInt(countText);
  if (!count || isNaN(count)) { showToast('投稿がありません', 2000); return; }
  if (!confirm(count + ' 件の投稿をすべて削除します。\nこの操作は元に戻せません。')) return;

  var btn = this;
  btn.disabled = true;
  btn.textContent = '削除中...';
  try {
    var snap = await db.collection('bbs_posts').get();
    var batch = db.batch();
    var n = 0;
    for (var i = 0; i < snap.docs.length; i++) {
      batch.delete(snap.docs[i].ref);
      n++;
      if (n % 499 === 0) { await batch.commit(); batch = db.batch(); }
    }
    await batch.commit();
    document.getElementById('postCount').textContent = '0';
    showToast('全件削除しました', 2500);
  } catch(e) {
    showToast('削除失敗: ' + e.message, 4000);
  }
  btn.disabled = false;
  btn.textContent = '全件削除';
});

/* ── 受信者管理 ── */
var _recipients = [];

async function loadRecipients() {
  var listEl = document.getElementById('recipientList');
  listEl.innerHTML = '<div class="empty-msg">読み込み中...</div>';
  try {
    var doc = await db.collection('settings').doc('mail').get();
    _recipients = (doc.exists && Array.isArray(doc.data().recipients))
      ? doc.data().recipients : [];
  } catch(e) { _recipients = []; }
  renderRecipients();
}

function renderRecipients() {
  var listEl = document.getElementById('recipientList');
  if (!_recipients.length) {
    listEl.innerHTML = '<div class="empty-msg">受信者が登録されていません</div>';
    return;
  }
  listEl.innerHTML = '';
  _recipients.forEach(function(email, i) {
    var row = document.createElement('div');
    row.className = 'recipient-row';
    var span = document.createElement('span');
    span.className = 'recipient-email';
    span.textContent = email;
    var delBtn = document.createElement('button');
    delBtn.className = 'del-btn';
    delBtn.textContent = '削除';
    delBtn.addEventListener('click', function() { removeRecipient(i); });
    row.appendChild(span);
    row.appendChild(delBtn);
    listEl.appendChild(row);
  });
}

async function saveRecipients() {
  await db.collection('settings').doc('mail').set({ recipients: _recipients });
}

async function removeRecipient(i) {
  if (!confirm(_recipients[i] + ' を削除しますか？')) return;
  _recipients.splice(i, 1);
  await saveRecipients();
  renderRecipients();
  showToast('削除しました', 2000);
}

document.getElementById('addEmailBtn').addEventListener('click', async function() {
  var input = document.getElementById('newEmailInput');
  var email = input.value.trim().toLowerCase();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showToast('正しいメールアドレスを入力してください', 2500); return;
  }
  if (_recipients.includes(email)) {
    showToast('すでに登録されています', 2000); return;
  }
  _recipients.push(email);
  try {
    await saveRecipients();
    input.value = '';
    renderRecipients();
    showToast('追加しました', 2000);
  } catch(e) {
    _recipients.pop();
    showToast('保存失敗: ' + e.message, 3000);
  }
});

document.getElementById('newEmailInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('addEmailBtn').click();
});
</script>
</body>
</html>
