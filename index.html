<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>上戸地区 防災マップ</title>
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./style.css?v=11" />
  </head>
  <body>
    <main class="page">
      <section class="map-card">
        <div id="map" aria-label="地図"></div>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <!-- 初期登録モーダル -->
    <div id="regModal" style="display:none">
      <div id="regBox">
        <div id="regTitle">📍 上戸区防災マップ</div>
        <div id="regSubtitle">はじめに情報を登録してください</div>
        <div class="reg-field">
          <label>組名</label>
          <select id="regKumi">
            <option value="">── 選択してください ──</option>
            <option>tester</option>
            <optgroup label="南部">
              <option>南部1組</option>
              <option>南部2組</option>
              <option>南部3組</option>
              <option>南部4組</option>
            </optgroup>
            <optgroup label="北部">
              <option>北部1組</option>
              <option>北部2組</option>
              <option>北部3組</option>
              <option>北部4組</option>
              <option>北部5組</option>
              <option>北部6組</option>
              <option>北部7組</option>
              <option>北部8組</option>
              <option>北部9組</option>
            </optgroup>
          </select>
        </div>
        <div class="reg-field">
          <label>氏名</label>
          <input id="regName" type="text" placeholder="氏名を入力..." maxlength="20">
        </div>
        <div id="regError"></div>
        <button id="regSubmit">登録して始める</button>
      </div>
    </div>

    <!-- SOSボタン -->
    <button id="sosBtn" title="緊急SOS">SOS</button>

    <!-- 地域掲示板 フロートボタン -->
    <button id="bbsFloatBtn">📋 地域掲示板<span id="bbsBadge"></span></button>

    <!-- 地域掲示板 パネル -->
    <div id="bbsPanel">
      <div id="bbsHandle">
        <div id="bbsHandleGrip"><span></span><span></span><span></span></div>
        <span id="bbsPanelTitle">📋 地域掲示板</span>
        <button id="bbsRefreshBtn" title="更新">🔄</button>
        <button id="bbsCollapseBtn" title="折りたたむ">▾</button>
        <button id="bbsClose">✕</button>
      </div>
      <div id="bbsBody">
        <!-- 投稿者バー -->
        <div id="bbsAuthorBar">
          <span id="bbsAuthorBarLabel">👤</span>
          <span id="bbsAuthorBarInfo">未登録</span>
          <button id="bbsAuthorEditBtn">変更</button>
        </div>
        <div id="bbsListPane" class="bbs-pane">
          <button id="bbsNewBtn">＋ 新規投稿</button>
          <div id="bbsLoadingMsg">読み込み中...</div>
          <div id="bbsEmptyMsg" style="display:none">投稿がありません</div>
          <div id="bbsList"></div>
        </div>
        <div id="bbsNewPane" class="bbs-pane" style="display:none">
          <!-- ① タイプ選択 -->
          <div id="bbsTypePane">
            <button class="bbs-back-to-list-btn">← 一覧に戻る</button>
            <button class="bbs-type-big-btn" data-type="safety">
              <span class="bbs-tbig-icon">🗒️</span>
              <span class="bbs-tbig-text">安否確認<small>（組長用）</small></span>
            </button>
            <button class="bbs-type-big-btn" data-type="disaster">
              <span class="bbs-tbig-icon">📝</span>
              <span class="bbs-tbig-text">自由コメント<small>（誰でも可）</small></span>
            </button>
          </div>
          <!-- ② 安否確認フォーム -->
          <div id="bbsSafetyPane" style="display:none">
            <button class="bbs-back-btn">← 戻る</button>
            <div class="bbs-field">
              <label>状況</label>
              <select id="bbsStatusSel">
                <option value="全員無事を確認">✅ 全員無事を確認</option>
                <option value="異常あり">⚠️ 異常あり</option>
              </select>
            </div>
            <div class="bbs-field">
              <label>コメント（任意）</label>
              <textarea id="bbsSafetyComment" rows="2" placeholder="補足があれば入力..."></textarea>
            </div>
          </div>
          <!-- ③ 自由コメントフォーム -->
          <div id="bbsDisasterPane" style="display:none">
            <button class="bbs-back-btn">← 戻る</button>
            <div class="bbs-field">
              <label>コメント <span style="color:#c00">*</span></label>
              <textarea id="bbsDisasterComment" rows="3" placeholder="状況を入力..."></textarea>
            </div>
            <div class="bbs-field">
              <label>写真（任意）</label>
              <div style="display:flex;gap:6px;flex-wrap:wrap">
                <button class="bbs-action-btn" id="bbsTakePhotoBtn">📷 撮影する</button>
                <button class="bbs-action-btn" id="bbsPickPhotoBtn">🖼 ギャラリー</button>
              </div>
              <input id="bbsPhotoInput" type="file" accept="image/*" style="display:none">
              <img id="bbsPhotoPreview" style="display:none;max-width:120px;max-height:80px;border-radius:6px;margin-top:6px;cursor:pointer">
            </div>
            <div class="bbs-field">
              <label>位置情報</label>
              <span id="bbsLocStatus" style="font-size:12px;color:#555">取得中...</span>
              <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:5px">
                <button class="bbs-action-btn" id="bbsClearLocBtn">✕ 位置情報を消す</button>
                <button class="bbs-action-btn" id="bbsUsePhotoLocBtn" style="display:none">📷 写真の位置を使う</button>
              </div>
            </div>
          </div>
          <button id="bbsSubmitBtn" style="display:none">📤 投稿する</button>
          <div id="bbsFormStatus"></div>
        </div>
      </div>
    </div>

    <!-- Excel連携 ファイル入力 -->
    <input id="xlsxInput" type="file" accept=".xlsx,.xls,.csv" style="display:none">

    <!-- Excel連携 色分け凡例 -->
    <div id="xlsxLegend" style="display:none">
      <div class="xl-leg-title">区加入区分</div>
      <div class="xl-leg-item"><span class="xl-leg-sw" style="background:rgba(76,175,80,0.75);border-color:#1b5e20"></span>加入</div>
      <div class="xl-leg-item"><span class="xl-leg-sw" style="background:rgba(255,235,59,0.8);border-color:#c87000"></span>協力金</div>
      <div class="xl-leg-item"><span class="xl-leg-sw" style="background:rgba(255,255,255,0.8);border-color:#d32f2f;border-width:2px"></span>休区</div>
      <div class="xl-leg-item"><span class="xl-leg-sw" style="background:rgba(200,200,200,0.5);border-color:#888"></span>その他</div>
    </div>

    <!-- Excel連携 統計カード -->
    <div id="xlsxStatCard">
      <span id="xlsxStatText"></span>
      <button id="xlsxStatClose" title="連携解除">✕</button>
    </div>

    <!-- Excel連携 モーダル -->
    <div id="xlsxModal">
      <div id="xlsxModalBox">
        <div id="xlsxModalTitle">📊 Excel連携</div>
        <div class="xlsxRow">
          <label class="xlsxLabel">対象レイヤー</label>
          <select id="xlsxLayerSel"></select>
        </div>
        <div class="xlsxRow">
          <label class="xlsxLabel">GeoJSON側キー列</label>
          <select id="xlsxKeyGeo"></select>
        </div>
        <div class="xlsxRow">
          <label class="xlsxLabel">Excel側キー列</label>
          <select id="xlsxKeyXls"></select>
        </div>
        <div class="xlsxRow" id="xlsxColorRow" style="display:none">
          <label class="xlsxLabel">色分け列（任意）</label>
          <select id="xlsxColorCol">
            <option value="">── 色分けなし ──</option>
          </select>
        </div>
        <div id="xlsxModalInfo"></div>
        <div class="xlsxBtns">
          <button id="xlsxModalCancel">キャンセル</button>
          <button id="xlsxModalOk" class="xlsxOk">連携する</button>
        </div>
      </div>
    </div>

    <!-- トースト通知 -->
    <div id="toast"></div>

    <!-- ライトボックス -->
    <div id="lightbox"><img id="lightboxImg" alt=""></div>

    <!-- 確認ダイアログ -->
    <div id="confirmOverlay">
      <div id="confirmBox">
        <div id="confirmMsg"></div>
        <div class="c-btns">
          <button class="c-cancel" id="confirmCancel">キャンセル</button>
          <button class="c-ok" id="confirmOk">続行</button>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/protomaps-leaflet@5.1.0/dist/protomaps-leaflet.js"></script>
    <script src="https://unpkg.com/exifr/dist/mini.legacy.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="./main.js?v=12"></script>
    <script src="./weather.js?v=3"></script>
    <script src="./excel.js?v=4"></script>

    <!-- 初期登録 + Firebase遅延ロード + SOS -->
    <script>
    (function() {
      /* ── 登録 ── */
      function _getReg() {
        return {
          kumi: localStorage.getItem('uedoBbsKumi') || '',
          name: localStorage.getItem('uedoBbsName') || ''
        };
      }
      function _saveReg(kumi, name) {
        localStorage.setItem('uedoBbsKumi', kumi);
        localStorage.setItem('uedoBbsName', name);
      }

      window._openRegModal = function(onComplete) {
        var reg = _getReg();
        document.getElementById('regKumi').value = reg.kumi || '';
        document.getElementById('regName').value  = reg.name  || '';
        document.getElementById('regError').textContent = '';
        document.getElementById('regModal').style.display = 'flex';
        document.getElementById('regSubmit').onclick = function() {
          var kumi = document.getElementById('regKumi').value;
          var name = document.getElementById('regName').value.trim();
          var err  = document.getElementById('regError');
          if (!kumi) { err.textContent = '組名を選択してください'; return; }
          if (!name) { err.textContent = '氏名を入力してください'; return; }
          _saveReg(kumi, name);
          document.getElementById('regModal').style.display = 'none';
          if (typeof onComplete === 'function') onComplete();
        };
        document.getElementById('regName').onkeydown = function(e) {
          if (e.key === 'Enter') document.getElementById('regSubmit').click();
        };
      };

      /* 初回訪問時に登録モーダルを表示 */
      window.addEventListener('load', function() {
        var reg = _getReg();
        if (!reg.kumi || !reg.name) window._openRegModal(function() {});
      });

      /* ── Firebase 遅延ロード ── */
      var _loaded = false, _loading = false, _queue = [];
      function _onReady() {
        _loaded = true;
        window._bbsStart();
        _queue.forEach(function(fn) { fn(); });
        _queue = [];
      }
      window._loadBbs = function(cb) {
        if (_loaded) { if (cb) cb(); return; }
        if (cb) _queue.push(cb);
        if (_loading) return;
        _loading = true;
        var srcs = [
          'https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js',
          'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js',
          'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js',
          './bbs.js?v=9'
        ];
        (function seq(i) {
          if (i >= srcs.length) { _onReady(); return; }
          var s = document.createElement('script');
          s.src = srcs[i];
          s.onload = function() { seq(i + 1); };
          document.body.appendChild(s);
        })(0);
      };

      /* 掲示板ボタン（初回クリックでロード） */
      document.getElementById('bbsFloatBtn').addEventListener('click', function() {
        _loadBbs(function() { openBbsPanel(); });
      }, { once: true });

      /* SOSボタン — アニメーション（iOS対応） */
      (function() {
        var btn = document.getElementById('sosBtn');
        btn.addEventListener('touchstart', function() { btn.classList.add('pressed'); }, { passive: true });
        btn.addEventListener('touchend',   function() { btn.classList.remove('pressed'); }, { passive: true });
        btn.addEventListener('touchcancel',function() { btn.classList.remove('pressed'); }, { passive: true });
      })();

      /* SOSボタン — 送信 */
      document.getElementById('sosBtn').addEventListener('click', function() {
        var reg = _getReg();
        if (!reg.kumi || !reg.name) {
          window._openRegModal(function() {
            document.getElementById('sosBtn').click();
          });
          return;
        }
        toast('🆘 SOS処理中...', 4000);
        _loadBbs(function() {
          if (typeof window._bbsSendSOS === 'function') window._bbsSendSOS();
          else toast('SOS機能を読み込めませんでした', 3000);
        });
      });
    })();
    </script>
  </body>
</html>
